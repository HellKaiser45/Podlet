x-podlet-user: &podlet-user
  user: "${PODLET_UID:?PODLET_UID is required. Use scripts/docker-compose.sh}:${PODLET_GID:?PODLET_GID is required. Use scripts/docker-compose.sh}"

services:
  agent-core:
    <<: *podlet-user
    build:
      context: ./agent_core_py
    environment:
      - HOME=${HOME}
    volumes:
      - ${HOME}/.podlet:${HOME}/.podlet
    networks:
      - podlet-internal
    restart: unless-stopped

  gateway:
    <<: *podlet-user
    build:
      context: .
    ports:
      - 3000:3000
    environment:
      - PODLET_DOCKER=1
      - LLM_SERVICE_HOST=agent-core
      - HOME=${HOME}
    volumes:
      - ${HOME}/.podlet:${HOME}/.podlet
    networks:
      - podlet-internal
    depends_on:
      - agent-core
    restart: on-failure
    tty: true
    stdin_open: true

networks:
  podlet-internal:
