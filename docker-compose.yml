# ============================================================
# Podlet Docker Compose
#
# IMPORTANT: Create a .env file before running:
#   echo "PODLET_DIR=$HOME/.podlet" > .env
#
# This ensures Docker can find your Podlet data directory.
# ============================================================

services:
  agent-core:
    build:
      context: ./agent_core_py
    volumes:
      - ${PODLET_DIR:?Set PODLET_DIR in .env file (see .env.docker.example)}:/root/.podlet
    networks:
      - podlet-internal
    restart: unless-stopped

  gateway:
    build:
      context: .
    ports:
      - "${GATEWAY_PORT:-3002}:3000"
    environment:
      - PODLET_DOCKER=1
      - LLM_SERVICE_HOST=agent-core
    volumes:
      - ${PODLET_DIR:?Set PODLET_DIR in .env file (see .env.docker.example)}:/root/.podlet
    networks:
      - podlet-internal
    depends_on:
      - agent-core
    restart: on-failure
    tty: true
    stdin_open: true

networks:
  podlet-internal:
