# ============================================================
# Podlet Docker Compose
#
# No .env file needed for standard setups.
# Podlet data is always at ~/.podlet (mounted to /root/.podlet).
#
# Optional: override mount source via .env:
#   echo "PODLET_DIR=/custom/path/.podlet" > .env
# ============================================================

services:
  agent-core:
    build:
      context: ./agent_core_py
    volumes:
      - ${PODLET_DIR:-~/.podlet}:/root/.podlet
    networks:
      - podlet-internal
    restart: unless-stopped

  gateway:
    build:
      context: .
    ports:
      - "${GATEWAY_PORT:-3002}:3000"
    environment:
      - PODLET_DOCKER=1
      - LLM_SERVICE_HOST=agent-core
    volumes:
      - ${PODLET_DIR:-~/.podlet}:/root/.podlet
    networks:
      - podlet-internal
    depends_on:
      - agent-core
    restart: on-failure
    tty: true
    stdin_open: true

networks:
  podlet-internal:
