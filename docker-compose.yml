# ============================================================
# Podlet Docker Compose
#
# Podlet data is always at ~/.podlet on every OS.
# Inside the container it is mounted at /root/.podlet.
# No .env file needed.
# ============================================================

services:
  agent-core:
    build:
      context: ./agent_core_py
    volumes:
      - $HOME/.podlet:/root/.podlet
    networks:
      - podlet-internal
    restart: unless-stopped

  gateway:
    build:
      context: .
    ports:
      - "${GATEWAY_PORT:-3002}:3000"
    environment:
      - PODLET_DOCKER=1
      - LLM_SERVICE_HOST=agent-core
    volumes:
      - $HOME/.podlet:/root/.podlet
    networks:
      - podlet-internal
    depends_on:
      - agent-core
    restart: on-failure
    tty: true
    stdin_open: true

networks:
  podlet-internal:
